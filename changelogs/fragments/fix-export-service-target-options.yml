bugfixes:
  - export role - services now always export ``targets[].direct_upstream``. The
    API omits it when false while ``netbird_service`` defaults it to true, so
    applying an export switched tunnel-dialed targets to direct dialing, or
    failed on proxy clusters that do not allow direct upstreams.
  - export role - services now export ``targets[].proxy_protocol`` when it is
    enabled. It was not exported, so applying an export turned it off.
  - preview - service target options are compared at the value an apply sends.
    A boolean option the API omits reads as false, and one a config leaves out
    reads as the ``netbird_service`` default, so a config without
    ``direct_upstream`` now previews the switch to direct dialing instead of
    reporting no change. A target without ``enabled`` reads as enabled, so a
    config that would re-enable a disabled target previews that too.
